# deploy/compose.yaml
#
# M2: OpenEMS Edge and its built-in UI, simulation only. Nothing here is deployed
# anywhere. OpenEMS is run unmodified from its upstream images (see ADR 0002 and
# ADR 0003). This project is not affiliated with or endorsed by OpenEMS.
#
# Usage (from this directory):
#   cp .env.example .env
#   docker compose config      # validate and show the resolved file
#   docker compose up -d
#
# Every setting comes from deploy/.env. If a value is missing or empty, Compose
# stops with an error instead of falling back to a default (fail safe). When an
# update adds variables to .env.example, add them to your .env as well.
#
# Not settings, so written here: the container-internal ports (8080, 8085, 80),
# the service names, and the volume paths. They are facts about the upstream images.

name: ke-ems

services:
  # One-shot helper. Prepares a fresh Edge config volume, then exits:
  #   1. If the volume is empty, it installs the image's own default config first.
  #      Edge's start-up script (init-openems-config) installs those defaults only
  #      into an EMPTY config directory, so adding our files first would skip them
  #      and leave Edge without its scheduler and websocket controller.
  #   2. It adds the simulated-chain seed config (deploy/edge-seed/config).
  # If the volume already holds the seeded files it does nothing, so it never
  # overwrites changes. It reuses the pinned Edge image, so no extra image is
  # introduced. The defaults path below was read from that image's init script on
  # 2026-10-16 (openems/edge:2026.9.0). Re-check it whenever the image is updated.
  openems-edge-seed:
    image: "${OPENEMS_EDGE_IMAGE:?Set OPENEMS_EDGE_IMAGE in deploy/.env (see .env.example)}"
    restart: "no"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        dest=/var/opt/openems/config
        defaults=/var/lib/openems-default-config
        if [ -d "$$dest/Simulator" ]; then
          echo "seed: $$dest/Simulator already exists, nothing to do"
          exit 0
        fi
        if [ -z "$$(ls -A "$$dest")" ]; then
          if [ ! -d "$$defaults" ]; then
            echo "seed: $$defaults not found in this image; refusing to continue" >&2
            exit 1
          fi
          cp -a "$$defaults/." "$$dest/"
          echo "seed: installed the image default config into the empty volume"
        fi
        cp -R /seed/. "$$dest/"
        chown -R 911:911 "$$dest"
        echo "seed: copied simulated chain config into $$dest"
    volumes:
      - openems-edge-conf:/var/opt/openems/config:rw
      - ./edge-seed/config:/seed:ro

  openems-edge:
    image: "${OPENEMS_EDGE_IMAGE:?Set OPENEMS_EDGE_IMAGE in deploy/.env (see .env.example)}"
    hostname: openems-edge
    restart: unless-stopped
    depends_on:
      openems-edge-seed:
        condition: service_completed_successfully
    # Memory cap for the Java process. Keep it generous (see .env.example).
    mem_limit: "${EDGE_MEM_LIMIT:?Set EDGE_MEM_LIMIT in deploy/.env}"
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:?Set LOG_MAX_SIZE in deploy/.env}"
        max-file: "${LOG_MAX_FILE:?Set LOG_MAX_FILE in deploy/.env}"
    volumes:
      # Edge configuration (OSGi config files) and runtime data.
      - openems-edge-conf:/var/opt/openems/config:rw
      - openems-edge-data:/var/opt/openems/data:rw
    ports:
      # Bound to BIND_ADDRESS (127.0.0.1 by default in .env.example). Docker-published
      # ports bypass ufw and firewalld, so this binding is the access control.
      # The websocket (container port 8085) is deliberately NOT published: the UI
      # container reaches it over the Compose network. Observed on 2026-10-16: the UI
      # logged in and showed live data with only the UI port forwarded.
      - "${BIND_ADDRESS:?Set BIND_ADDRESS in deploy/.env}:${EDGE_FELIX_PORT:?Set EDGE_FELIX_PORT in deploy/.env}:8080" # Apache Felix console

  openems-ui:
    image: "${OPENEMS_UI_IMAGE:?Set OPENEMS_UI_IMAGE in deploy/.env (see .env.example)}"
    hostname: openems-ui
    restart: unless-stopped
    depends_on:
      - openems-edge
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:?Set LOG_MAX_SIZE in deploy/.env}"
        max-file: "${LOG_MAX_FILE:?Set LOG_MAX_FILE in deploy/.env}"
    environment:
      # Documented settings of the upstream UI image: where to reach Edge's websocket.
      WEBSOCKET_HOST: openems-edge
      WEBSOCKET_PORT: "8085"
    ports:
      - "${BIND_ADDRESS}:${UI_HTTP_PORT:?Set UI_HTTP_PORT in deploy/.env}:80"

volumes:
  openems-edge-conf:
  openems-edge-data:
